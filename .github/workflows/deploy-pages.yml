name: Опубликовать сайт на GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v6

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Собрать статический сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v5
